spring.application.name=cloudx-2025-app
server.port=8080
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/cloudx2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
cloud.aws.s3.bucket-name=${S3_BUCKET}
# SQS and SNS configuration
aws.sqs.uploads-notification-queue-url=${UPLOADS_NOTIFICATION_QUEUE_URL}
aws.sqs.uploads-notification-queue-arn=${UPLOADS_NOTIFICATION_QUEUE_ARN}
aws.sns.uploads-notification-topic-arn=${UPLOADS_NOTIFICATION_TOPIC_ARN}
