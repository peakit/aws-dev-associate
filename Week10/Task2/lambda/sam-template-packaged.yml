AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for <ProjectName>-UploadsNotificationFunction
Parameters:
  ProjectName:
    Type: String
    Description: Project name for resource naming
  SnsTopicArn:
    Type: String
    Description: ARN of the SNS topic
  SqsQueueArn:
    Type: String
    Description: ARN of the SQS queue
  SqsQueueUrl:
    Type: String
    Description: URL of the SQS queue
  S3BucketName:
    Type: String
    Description: S3 bucket name for S3LogsFunction
Resources:
  UploadsNotificationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${ProjectName}-UploadsNotificationLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: SNSPublishPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action: sns:Publish
            Resource:
              Ref: SnsTopicArn
      - PolicyName: SQSReceivePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            Resource:
              Ref: SqsQueueArn
    Metadata:
      SamResourceId: UploadsNotificationLambdaRole
  UploadsNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-UploadsNotificationFunction
      Runtime: python3.11
      Handler: uploads_notification.lambda_handler
      Role:
        Fn::GetAtt:
        - UploadsNotificationLambdaRole
        - Arn
      CodeUri: s3://cloudx2025-harshitmanaktala-20250720-site/163c08ceb86f18e6d6691c4abb78967e
      Environment:
        Variables:
          SNS_TOPIC_ARN:
            Ref: SnsTopicArn
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue:
              Ref: SqsQueueArn
            BatchSize: 10
      DeploymentPreference:
        Type: AllAtOnce
        Alarms:
        - Fn::Sub: ${ProjectName}-UploadsNotificationFunction-Alarm
        Hooks:
          PreTraffic:
            Fn::Sub: ${ProjectName}-PreTrafficHook
          PostTraffic:
            Fn::Sub: ${ProjectName}-PostTrafficHook
      Timeout: 30
      AutoPublishAlias: live
    Metadata:
      SamResourceId: UploadsNotificationFunction
  S3LogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ProjectName}-S3LogsFunction
      Runtime: python3.11
      Handler: s3_logs.lambda_handler
      CodeUri: s3://cloudx2025-harshitmanaktala-20250720-site/f00ff4205ff95a938d1ffd622537e747
      Policies:
      - S3ReadPolicy:
          BucketName:
            Ref: S3BucketName
      Timeout: 15
    Metadata:
      SamResourceId: S3LogsFunction
Outputs:
  UploadsNotificationFunctionArn:
    Description: ARN of the UploadsNotification Lambda function
    Value:
      Fn::GetAtt:
      - UploadsNotificationFunction
      - Arn
  S3LogsFunctionArn:
    Description: ARN of the S3Logs Lambda function
    Value:
      Fn::GetAtt:
      - S3LogsFunction
      - Arn
